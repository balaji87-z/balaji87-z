name: generate profile graphics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: balaji87-z
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#C41392&color_dots=#ebedf0,#FFD1F2,#F79ADF,#EE3EBC,#C41392
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF5FD2&color_dots=#161b22,#3A0F2E,#7E0E5F,#C41392,#EE3EBC

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: balaji87-z
          SETTING_JSON: .github/profile-3d/matrix.json

      # The snake step runs in a container and leaves dist/ owned by root,
      # so gather everything in a directory this job can write to.
      - name: Collect generated graphics
        run: |
          mkdir -p public
          cp dist/*.svg profile-3d-contrib/*.svg public/

      - name: Push graphics to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
